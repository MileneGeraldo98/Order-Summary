    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./style.css">
        <title>Order Summary</title>
    </head>
    <body>
        <div class="container">
            <img src="./Images/illustration-hero.png" class="hero-img">
            <h1>Order Summary</h1>
            <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like! </p>
            <div class="card-container">
                <img src="./Images/icon-music.png" alt="Music Icon" class="icon-music">
                <div class="textos">
                    <p class="titulo-paragrafo">Annual Plan</p>
                    <p class="descricao-paragrafo">$59.99/year</p>
                </div>
                 <a href="#" class="change">Change</a>
            </div>
            <div class="container-button">
                <button class="button-container">Proceed to Payment</button>
            </div>
            <div class="container-button">
                <button class="button-cancel">Cancel Order</button>
            </div>
        </div>
    </body>
    </html>
